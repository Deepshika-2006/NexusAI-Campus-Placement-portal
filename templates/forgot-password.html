<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Reset Password — NexusAI</title>

  <!-- Main NexusAI stylesheet -->
  <link rel="stylesheet" href="/css/style.css">
</head>

<body class="auth-page">

  <div class="auth-shell">

    <!-- =====================================================
         AUTH BRANDING
    ====================================================== -->
    <div class="auth-brand">

      <a class="brand" href="/index.html">

        <!-- NexusAI Logo -->
        <div class="logo">N</div>

        <!-- Brand Name -->
        <div>
          <div class="brand-title">
            NexusAI
          </div>

          <div class="brand-sub">
            Campus Career Copilot
          </div>
        </div>

      </a>

    </div>


    <!-- =====================================================
         PASSWORD RESET CARD
    ====================================================== -->
    <div class="auth-center card auth-card auth-card-pro">

      <!-- Section Label -->
      <span class="label">
        ACCOUNT RECOVERY
      </span>

      <!-- Page Heading -->
      <h2>
        Reset your password
      </h2>

      <p>
        Enter your registered email to start account recovery.
      </p>


      <!-- ===================================================
           PASSWORD RESET FORM
      ==================================================== -->
      <form
        action="/forgot-password/"
        method="post"
      >

        <!-- Django CSRF Protection -->
        {% csrf_token %}


        <!-- Registered Email -->
        <div class="field">

          <label for="reset-email">
            Registered Email
          </label>

          <input
            id="reset-email"
            type="email"
            name="email"
            placeholder="alex.chen@campus.edu"
            required
          >

        </div>


        <!-- =================================================
             DJANGO MESSAGE DISPLAY
             Displays success/error messages returned
             by the password-reset view.
        ================================================== -->
        {% if messages %}

          <div class="notice">

            {% for message in messages %}

              {{ message }}

              {% if not forloop.last %}
                <br>
              {% endif %}

            {% endfor %}

          </div>

        {% endif %}


        <!-- Submit Button -->
        <button
          class="btn primary auth-submit"
          type="submit"
        >
          Send Reset Instructions →
        </button>

      </form>


      <!-- ===================================================
           BACK TO LOGIN
      ==================================================== -->
      <a
        class="btn secondary auth-alt"
        href="/login.html"
      >
        Back to Sign In
      </a>

    </div>

  </div>

</body>

</html>
